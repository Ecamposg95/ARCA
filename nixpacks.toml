# Build ARCA en Railway: Python 3.11 (API) + Node 20 (build de la SPA).

[phases.setup]
nixPkgs = ["python311", "nodejs_20"]
aptPkgs = ["build-essential", "libpq-dev"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt",
]

[phases.build]
cmds = [
  # --include=dev: Nixpacks exporta NODE_ENV=production y sin esto vite/tsc no se instalan.
  "cd frontend && npm ci --include=dev && npm run build && cd ..",
]

[start]
# Único lugar con el start command (railway.json NO define startCommand para evitar drift).
cmd = ". /opt/venv/bin/activate && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'"
