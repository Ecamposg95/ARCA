[pytest]
testpaths = tests
# Sin esto, `pytest` a secas no encuentra el paquete `app` (CI falló por eso
# desde agosto de 2026): sólo `python -m pytest` agrega la raíz al path.
pythonpath = .
python_files = test_*.py
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning:passlib.*
markers =
    postgres: requiere PostgreSQL real (se omite en modo SQLite)
